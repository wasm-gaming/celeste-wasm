name: Build

# Builds the three halves of a release and leaves them as artifacts. What
# happens to them afterwards — Release assets, npm, Pages — belongs to
# release.yml, which calls this workflow.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: >-
          Version to stamp across package.json and the manifest before building.
          Blank builds whatever the checkout says, which is what a PR wants.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Per ref, and only PRs get cancelled: a release build is doing work nothing
  # else will redo, and the pushes behind it are minutes apart at most.
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with the Makefile; used for the cache keys.
  EVEREST_REF: a756f4710f81dd30e41469a950fd245451dd55d9
  RUNTIME_REF: latest

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Only this job needs it: `everest` compiles C# and `runtime` downloads a
      # pinned bundle, neither of which reads package.json. Here it decides what
      # dist/manifest.json and the published sources say, so it has to happen
      # before the build rather than in the commit that follows it.
      - name: Stamp the release version
        if: inputs.version != ''
        run: node scripts/sync-version.mjs "${{ inputs.version }}"
      - name: Install dependencies
        run: npm ci
      - name: Build SDK (TypeScript + manifest + demo shell)
        run: make build-sdk
      - name: Test
        run: make test

      # Packed here, where the version is already stamped and dist/ is on disk,
      # so the bytes that get published are the bytes that were tested — rather
      # than a tree reassembled on another runner out of an artifact, a checkout
      # and a version rewrite. On a pull request it doubles as the check that
      # every `files` entry in package.json still resolves.
      - name: Pack
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: '*.tgz'

  everest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          # net9.0 to build with, net8.0 to target — the same split the upstream
          # pipeline uses.
          dotnet-version: |
            9.0.x
            8.0.x

      # MonoMod's IL projects assemble through Microsoft.Net.Sdk.IL, which
      # shells out to ilasm; on Linux that comes from mono.
      - name: Install mono
        run: sudo apt-get update && sudo apt-get install -y mono-devel

      - name: Cache the upstream checkout
        uses: actions/cache@v4
        with:
          path: .tmp/everest-src
          key: everest-src-${{ env.EVEREST_REF }}

      - name: Build Everest
        run: make build-everest

      - uses: actions/upload-artifact@v4
        with:
          name: everest-dist
          path: |
            dist/celeste/everest.*
            dist/celeste/celeste-icon.png

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The bundle is ~43 MB compressed and ~250 MB unpacked; downloading it
      # once per pinned release is the difference between a 1-minute job and a
      # 5-minute one.
      - name: Cache the runtime bundle
        uses: actions/cache@v4
        with:
          path: .tmp/runtime
          key: celeste-runtime-${{ env.RUNTIME_REF }}

      - name: Install the runtime
        run: make build-runtime

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-dist
          path: |
            dist/celeste/_framework/
            dist/celeste/runtime.json
