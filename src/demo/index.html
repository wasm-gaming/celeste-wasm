<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>Celeste + Everest — WebAssembly SDK demo</title>
  <link rel="stylesheet" href="./demo/demo.css" />
  <link rel="stylesheet" href="./theme.celeste.css" />
  <!-- Adds COOP/COEP through a service worker on hosts that will not send them
       (GitHub Pages, most static CDNs). No-op when they already arrive. -->
  <script src="./coi.js"></script>
  <script type="importmap">
    {
      "imports": {
        "@wasm-gaming/celeste-wasm": "./celeste/celeste.sdk.js",
        "@wasm-gaming/celeste-wasm/install": "./celeste/celeste.install.js",
        "@wasm-gaming/celeste-wasm/zip": "./celeste/celeste.zip.js"
      }
    }
  </script>
</head>
<body>
  <header class="summit-bar">
    <span class="wordmark">CELESTE</span>
    <span class="badge">EVEREST</span>
    <button type="button" id="pick-folder" hidden>Use my Celeste folder…</button>
    <span class="install-status" role="status"></span>
    <span class="runtime-tag">page <b id="isolation">…</b></span>
  </header>

  <main></main>

  <!-- Publishes window.CELESTE for the wiring below. Module scripts run in
       document order, so this one has finished before the inline module. -->
  <script type="module" src="./demo.js"></script>

  <script type="module">
    // Toggle fullscreen on Cmd+Enter (Mac) / Ctrl+Enter (other). Celeste's own
    // fullscreen toggle is inside the game, and Escape belongs to it.
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
        e.preventDefault()
        const target = document.querySelector('main') || document.documentElement
        if (!document.fullscreenElement) {
          target.requestFullscreen?.().catch(() => {})
        } else {
          document.exitFullscreen?.().catch(() => {})
        }
      }
    })

    import demo from './demo/demo.js'

    const {
      sdk,
      manifest,
      pickGameDirectory,
      gameDirectory,
      stagedInstall,
      checkArchive,
      canPickDirectory,
    } = window.CELESTE

    const mainEl = document.querySelector('main')
    const statusEl = document.querySelector('.summit-bar .install-status')
    const setStatus = (text, bad = false) => {
      statusEl.textContent = text
      statusEl.classList.toggle('bad', bad)
    }

    // Drawn where the game would have been, when it never gets that far.
    const showOnStage = (stageEl, reason) => {
      stageEl.replaceChildren(
        Object.assign(document.createElement('p'), {
          className: 'stage-message',
          textContent: reason,
        }),
      )
    }

    /**
     * The loading screen, drawn over the stage.
     *
     * Boot is minutes long on a first run — copy the install, download the
     * runtime, then MonoMod over the whole game — and the header that used to
     * carry that news is hidden once the stage goes fullscreen. So the progress
     * has to live where the player is already looking.
     *
     * It is an overlay rather than something painted into the canvas: the
     * canvas is handed to a worker with transferControlToOffscreen the moment
     * the runtime starts, and from then on the page cannot draw a single pixel
     * into it. The overlay sits on top and comes off when the game is up.
     */
    const createStageHud = (stageEl) => {
      const make = (tag, props) => Object.assign(document.createElement(tag), props)

      const phaseEl = make('p', { className: 'hud-phase', textContent: 'Starting Celeste…' })
      const fillEl = make('i', {})
      const barEl = make('div', { className: 'hud-bar busy' })
      const detailEl = make('p', { className: 'hud-detail', textContent: '' })
      barEl.append(fillEl)

      const hud = make('div', { className: 'stage-hud', role: 'status' })
      hud.setAttribute('aria-live', 'polite')
      hud.append(make('span', { className: 'hud-mark', textContent: 'CELESTE' }), phaseEl, barEl, detailEl)
      stageEl.append(hud)

      let closed = false

      return {
        /** Determinate: a fraction the SDK actually knows. */
        progress(phase, current, total, detail = '') {
          phaseEl.textContent = `${phase} ${Math.round((current / total) * 100)}%`
          detailEl.textContent = detail
          barEl.classList.remove('busy')
          fillEl.style.width = `${Math.max(0, Math.min(1, current / total)) * 100}%`
        },
        /** Indeterminate: the long steps report messages, not percentages. */
        busy(phase, detail = '') {
          phaseEl.textContent = phase
          detailEl.textContent = detail
          barEl.classList.add('busy')
          fillEl.style.width = ''
        },
        fail(message) {
          hud.classList.add('bad')
          phaseEl.textContent = message
          detailEl.textContent = ''
          barEl.remove()
        },
        close() {
          if (closed) return
          closed = true
          hud.classList.add('done')
          hud.addEventListener('transitionend', () => hud.remove(), { once: true })
          setTimeout(() => hud.remove(), 1200)
        },
      }
    }

    // Everything both routes share. `attachTo` is whichever stage element the
    // caller cleared for it.
    //
    // `main.running` is what takes the page over: the stage grows to the whole
    // viewport and the header goes away, so from here on the HUD is the only
    // thing reporting progress. The class goes on *before* load() so the game
    // boots straight into the size it will run at — the SDK measures the stage
    // just before the game reads its settings and picks the resolution there.
    const boot = async (stageEl, { assets = {}, gameDirectory, fileName }) => {
      mainEl.classList.add('running')
      setStatus('Staging the game…')

      const hud = createStageHud(stageEl)
      const fail = (message) => {
        mainEl.classList.remove('running')
        hud.fail(message)
        setStatus(message, true)
      }

      try {
        const instance = await sdk.load({
          attachTo: stageEl,
          assets,
          gameDirectory,
          options: {
            installFileName: fileName,
            // Both routes check the listing before getting here.
            verifyInstall: false,
          },
          onProgress(current, total) {
            if (total <= 0) return
            setStatus(`Staging the game… ${Math.round((current / total) * 100)}%`)
            if (current < total) {
              hud.progress('Copying your Celeste install…', current, total, `${current} / ${total} files`)
            } else {
              // Staging is over; what follows is the runtime download and
              // MonoMod, neither of which reports a fraction.
              hud.busy(
                'Building your patched Celeste…',
                'Downloading the runtime and running MonoMod over your install. The first run takes a few minutes — after that it is cached.',
              )
            }
          },
          onSplash(message, progress) {
            // Everest's own loading messages, forwarded from the mod loader.
            // The SDK has already read them out of the splash wire protocol,
            // so `progress` is a real mod count whenever the message carried
            // one — and there is nothing to show while it is zero (no mods).
            if (message === null) return setStatus('')
            if (!message) return
            setStatus(message)

            if (progress && progress.total > 0 && !progress.done) {
              hud.progress('Loading mods…', progress.loaded, progress.total, progress.mod ?? '')
            } else {
              hud.busy(message, 'Everest is starting the game.')
            }
          },
          onEvent(event) {
            if (event.type === 'error') {
              console.error(event.error)
              fail(event.error.message)
              return
            }

            console.log('[demo]', event.type)
            if (event.type === 'ready') {
              setStatus('')
              hud.close()
            }
            if (event.type === 'exit') {
              mainEl.classList.remove('running')
              showOnStage(stageEl, 'Celeste exited. Reload the page to play again.')
            }
          },
        })

        instance.start()

        // The first boot runs MonoMod over the whole game and takes minutes; the
        // patched build is cached in storage from then on.
        return instance
      } catch (err) {
        fail(err.message)
        throw err
      }
    }

    // --- the folder route ---------------------------------------------------
    //
    // Preferred wherever it exists: no 1.3 GB archive for the player to build,
    // and the SDK copies the install across file by file.
    //
    // The header button only ever picks a folder — it never becomes Start, so
    // a player who handed over the wrong one can hand over another. Starting is
    // routed through the launcher's own Start button below, which the shared
    // launcher would otherwise leave inert here: it gates on a *file* in its ROM
    // slot (`canLaunch = Boolean(romFile && …)`), and a directory handle never
    // puts one there.
    const pickButton = document.getElementById('pick-folder')
    let folderReady = false
    let stagedReady = false

    const STAGED_MESSAGE = canPickDirectory
      ? "Celeste is already in this browser's storage — press Start, or pick a folder to replace it."
      : "Celeste is already in this browser's storage — press Start, or drop a zip to replace it."

    // Serves both routes. When no folder was picked `gameDirectory()` is null,
    // and the SDK falls through to whatever a previous session staged — which
    // is the whole point of the storage probe below.
    const startGame = async () => {
      const stage = Object.assign(document.createElement('div'), { className: 'runtime' })
      mainEl.replaceChildren(stage)
      pickButton.disabled = true
      try {
        await boot(stage, {
          gameDirectory: gameDirectory(),
          fileName: folderReady ? 'Celeste (folder)' : 'Celeste (in storage)',
        })
      } catch (err) {
        console.error(err)
        // boot() has already put the message on the HUD and brought the header
        // back; this replaces the dead stage and lets the player try again.
        setStatus(err.message, true)
        showOnStage(stage, err.message)
        pickButton.disabled = false
      }
    }

    // The launcher's own Start button, made to mean something.
    //
    // It gates on a file in its ROM slot, so for the folder and storage routes
    // it is inert — and its disabled styling never applies, so it looks live
    // while doing nothing at all. That is the worst possible state for the most
    // obvious button on the page. The launcher renders into the light DOM (only
    // the ESC menu uses renderShadow), so a capture-phase listener can reach it.
    //
    // Which route wins is a question of how recently the player said so: a
    // folder they just picked beats a zip they just dropped, and both beat
    // whatever a previous session left in storage. The zip is the launcher's own
    // route, so standing aside is all that route needs.
    mainEl.addEventListener(
      'click',
      (event) => {
        if (!event.target.closest?.('.launch-btn')) return
        if (!folderReady && demo.hasFile('rom')) return

        event.preventDefault()
        event.stopPropagation()

        if (folderReady || stagedReady) {
          void startGame()
        } else {
          setStatus(
            canPickDirectory
              ? 'Nothing to start yet — pick your Celeste folder above, or drop a zip of it below.'
              : 'Nothing to start yet — drop a zip of your Celeste folder below. (This browser cannot hand over a folder; Chrome can.)',
            true,
          )
        }
      },
      true,
    )

    if (!canPickDirectory) {
      setStatus('This browser cannot hand over a folder — supply a zip, or use Chrome.')
    }

    // The picker stays a picker. Starting is the Start button's job — and a
    // player who handed over the wrong folder needs this button to still be the
    // way to hand over another one.
    if (canPickDirectory) {
      pickButton.hidden = false
      pickButton.addEventListener('click', async () => {
        setStatus('Reading folder…')
        try {
          const check = await pickGameDirectory()
          // Dialog closed: whatever was picked before is still picked.
          if (!check) {
            if (folderReady) return setStatus('Celeste found — press Start.')
            return setStatus(stagedReady ? STAGED_MESSAGE : '')
          }
          // A folder that does not check out replaces the one that did —
          // pickGameDirectory only keeps the handle when the check passes. A
          // staged install is still there to start, and saying so beats leaving
          // a live Start button under an error message.
          if (!check.ok) {
            folderReady = false
            return setStatus(
              stagedReady ? `${check.reason} Start will use the copy already in storage.` : check.reason,
              true,
            )
          }

          folderReady = true
          setStatus(
            `Celeste found${check.hasEverest ? ' (already Everest-patched)' : ''} — press Start, or pick another folder.`,
          )
        } catch (err) {
          setStatus(err.message, true)
        }
      })
    }

    demo
      .init({
        manifest,
        messages: {
          title: 'Celeste + Everest',
          dropRomPrompt: 'Drop a zip of your Celeste folder',
          romAssetHint: 'no part of the game ships with this package',
          launchButton: 'Start',
          statusSelectRom: 'Ready — supply the copy of Celeste you own.',
        },
        bios: false,
        // Escape is Celeste's pause key, and the game's own menu is the real
        // one. A second overlay on the same key would only fight it.
        escMenu: { enabled: false },
      })
      // Check the archive the moment it is picked, while the launcher is still
      // on screen and nothing has been downloaded or unpacked yet.
      .on('rom:save', async ({ file }) => {
        if (!file) return
        try {
          const check = await checkArchive(file)
          setStatus(check.ok ? 'Celeste found — press Start.' : check.reason, !check.ok)
        } catch (err) {
          setStatus(`That does not look like a zip: ${err.message}`, true)
        }
      })
      // The archive route. The shared launcher owns this button, and it only
      // enables once a file is in its ROM slot — which is exactly why the
      // folder route above needed a trigger of its own.
      .on('launch', async (e) => {
        const archive = await demo.loadToMEMFS('rom')
        const check = await checkArchive(archive)
        if (!check.ok) {
          setStatus(check.reason, true)
          showOnStage(e.attachTo, check.reason)
          throw new Error(check.reason)
        }

        return boot(e.attachTo, { assets: { game: archive }, fileName: e.fileName })
      })

    // --- the storage route --------------------------------------------------
    //
    // The staged install persists in OPFS, so a reload does not need the game
    // again — the SDK boots from storage when nothing is supplied. Nothing on
    // the page would ever discover that on its own, though: the launcher gates
    // Start on a file in its ROM slot, the picker starts empty on every load,
    // and neither survives a refresh. So ask storage directly, once, and turn
    // Start on if the answer is a Celeste that checks out.
    //
    // Last, so the launcher's own status render cannot land on top of it.
    void (async () => {
      try {
        const staged = await stagedInstall()
        if (!staged.ok) return
        stagedReady = true
        // A folder picked or a zip dropped while this was in flight is the more
        // specific intent, and its own message is already on screen.
        if (folderReady || demo.hasFile('rom')) return
        setStatus(STAGED_MESSAGE)
      } catch {
        // No storage to read, which is a browser that cannot run the game
        // either — the routes above will say so in their own terms.
      }
    })()
  </script>
</body>
</html>
